[package]
name = "harmonia"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Functional harmony helpers"
repository = "https://github.com/arclabs561/harmonia"
homepage = "https://github.com/arclabs561/harmonia"
readme = "README.md"
# The crates.io name `harmonia` belongs to another project.
publish = false
keywords = ["music", "music-theory", "harmony", "roman-numerals"]
categories = ["multimedia::audio"] # closest stable crates.io category; scope is symbolic theory

[workspace]

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = []
cli = ["dep:clap", "dep:serde_json"]

[[bin]]
name = "harmonia"
test = false
path = "src/bin/harmonia.rs"
required-features = ["cli"]

[[test]]
name = "cli_json"
required-features = ["cli"]
